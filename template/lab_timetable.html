<!DOCTYPE html>
<html>
<head>
    <title>Add Lab Timetable Details</title>
    <style>
        body {
            background: url('/static/bg_page.jpg') no-repeat center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 70px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        input[type=text], input[type=number], select {
            width: 50%;
            padding: 12px 20px;
            margin: 8px 0;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            background-color: #04AA6D;
            color: white;
            padding: 12px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 80%;
        }

        table {
            width: 70%;
            border-collapse: collapse;
            margin: 10px auto;
            font-size: 14px;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: #f4f4f4;
        }

        h2, h3 {
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GENERATE LAB TIMETABLE</h1>
        <label for="department">Department:</label>
        &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;
        <select id="department">
            <option value="none" selected disabled>None</option>
            <option value="Basic_Engg_CE_IT">Basic CE and IT</option>
            <option value="Basic_Engg_ECE">Basic ECE</option>
            <option value="Basic_Engg_EEE">Basic EEE</option>
            <option value="Basic_Engg_CIVIL">Basic CIVIL</option>
            <option value="Basic_Engg_MECH">Basic MECH</option>
            <option value="Basic_Engg_AUTO">Basic AUTO</option>
            <option value="CE">Computer Engineering (CE)</option>
            <option value="IT">Information Technology (IT)</option>
            <option value="ECE">Electronics & Communication Engineering (ECE)</option>
            <option value="EEE">Electrical & Electronics Engineering (EEE)</option>
            <option value="MECH">Mechanical Engineering (MECH)</option>
            <option value="AUTO">Automobile Engineering (AUTO)</option>
            <option value="CIVIL">Civil Engineering (CIVIL)</option>
        </select><br>
        <label for="HoursPerDay">No of Hours per Day:</label>
        <select id="HoursPerDay">
            <option value="none" selected disabled>None</option>
            <option value="7">7</option>
            <option value="8">8</option>
        </select><br>
        <button onclick="SaveData()" id="lab_timetable">GENERATE LAB TIMETABLE</button>
    </div>
    <br>
    <div id="timetable-container"><center><h1>Lab Timetable</h1></center></div>

    <script>
         window.onload = function () {
    sessionStorage.removeItem("timetable_shown");
    document.getElementById("timetable-container").innerHTML = "";
};

function SaveData() {
    const department = document.getElementById("department").value;
    const hours_per_day = parseInt(document.getElementById("HoursPerDay").value);

    if (!department || hours_per_day <= 0) {
        alert("Please enter all required fields.");
        return;
    }


    const lab_timetable = { department, hours_per_day};

    console.log("Sending staff timetable data:", lab_timetable);

    fetch("http://127.0.0.1:5000/timetable_lab", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(lab_timetable)
    })
    .then(response => response.json())
    .then(data => {
        console.log("Received API response:", data);
        if (data.error) {
            alert("Error: " + data.error);
        } else if (!data.timetable || Object.keys(data.timetable).length === 0) {
            alert("No timetable generated.");
        } else {
            alert(data.message);
            sessionStorage.setItem("timetable_data", JSON.stringify(data.timetable));
            displayTimetable(data.timetable);
        }
    })
    .catch(error => {
        console.error("Fetch error:", error);
        alert("Failed to fetch timetable.");
    });
}

function displayTimetable(timetable) {
    try {
        const container = document.getElementById("timetable-container");
        container.innerHTML = "";

        // Handle error cases first
        if (!timetable || typeof timetable !== 'object') {
            container.innerHTML = "<p class='error'>Invalid timetable data received</p>";
            return;
        }

        if (timetable.error) {
            container.innerHTML = `<p class='error'>${timetable.error}</p>`;
            return;
        }

        if (Object.keys(timetable).length === 0) {
            container.innerHTML = "<p class='info'>No timetable available.</p>";
            return;
        }

        // Get configuration
        const hoursPerDay = parseInt(document.getElementById("HoursPerDay").value) || 8;
        const daysOfWeek = ["MON", "TUE", "WED", "THU", "FRI"];

        // Generate HTML for each lab
        for (const lab_name in timetable) {
            if (!timetable.hasOwnProperty(lab_name)) continue;

            const labData = timetable[lab_name];
            let tableHtml = `
                <div class="lab-timetable">
                <h2>${escapeHtml(lab_name)}</h2>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Day</th>
                            ${[...Array(hoursPerDay)].map((_, i) => `<th>Period ${i + 1}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Generate rows for each day
            daysOfWeek.forEach(day => {
                const periods = labData[day] || {};
                const slots = Array(hoursPerDay).fill("-"); // Initialize empty slots

                // Fill occupied periods
                Object.entries(periods).forEach(([periodStr, data]) => {
                    const period = parseInt(periodStr);
                    if (!isNaN(period) && period >= 1 && period <= hoursPerDay) {
                        slots[period - 1] = `${escapeHtml(data.subject)} (${escapeHtml(data.staff)})`;
                    }
                });

                tableHtml += `
                    <tr>
                        <td>${day}</td>
                        ${slots.map(slot => `<td>${slot}</td>`).join('')}
                    </tr>
                `;
            });

            tableHtml += `</tbody></table></div><br>`;
            container.innerHTML += tableHtml;
        }

    } catch (error) {
        console.error("Error displaying timetable:", error);
        const container = document.getElementById("timetable-container");
        container.innerHTML = `<p class='error'>Error displaying timetable: ${error.message}</p>`;
    }
}

// Helper function to prevent XSS
function escapeHtml(unsafe) {
    if (typeof unsafe !== 'string') return unsafe;
    return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
    </script>
</body>
</html>
