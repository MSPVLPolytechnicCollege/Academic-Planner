<!DOCTYPE html>
<html>
<head>
    <title>Add  Class Timetable Details</title>
    <style>
        body {
            background: url('/static/bg_page.jpg') no-repeat center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 70px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        input[type=text], input[type=number], select {
            width: 50%;
            padding: 12px 20px;
            margin: 8px 0;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            background-color: #04AA6D;
            color: white;
            padding: 12px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 80%;
        }

        table {
            width: 70%;
            border-collapse: collapse;
            margin: 10px auto;
            font-size: 14px;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: #f4f4f4;
        }

        h2, h3 {
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GENERATE CLASS TIMETABLE</h1>
        <label for="department">Department:</label>
        &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;
        <select id="department">
            <option value="none" selected disabled>None</option>
            <option value="CE">Computer Engineering (CE)</option>
            <option value="IT">Information Technology (IT)</option>
            <option value="ECE">Electronics & Communication Engineering (ECE)</option>
            <option value="EEE">Electrical & Electronics Engineering (EEE)</option>
            <option value="MECH">Mechanical Engineering (MECH)</option>
            <option value="AUTO">Automobile Engineering (AUTO)</option>
            <option value="CIVIL">Civil Engineering (CIVIL)</option>
        </select><br>
        <label for="HoursPerDay">No of Hours per Day:</label>
        <select id="HoursPerDay">
            <option value="none" selected disabled>None</option>
            <option value="7">7</option>
            <option value="8">8</option>
        </select><br>
        <button onclick="SaveData()" id="class_timetable">GENERATE CLASS TIMETABLE</button>
    </div>
    <br>
    <div id="timetable-container"><center><h1>Lab Timetable</h1></center></div>

    <script>
         window.onload = function () {
    sessionStorage.removeItem("timetable_shown");
    document.getElementById("timetable-container").innerHTML = "";
};

function SaveData() {
    const department = document.getElementById("department").value;
    const hours_per_day = parseInt(document.getElementById("HoursPerDay").value);

    if (!department || hours_per_day <= 0) {
        alert("Please enter all required fields.");
        return;
    }

    const class_timetable = { department, hours_per_day };

    console.log("Sending staff timetable data:", class_timetable);

    fetch("http://127.0.0.1:5000/timetable_class", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(class_timetable)
    })
    .then(response => response.json())
    .then(data => {
        console.log("Received API response:", data);
        if (data.error) {
            alert("Error: " + data.error);
        } else if (!data.timetables || Object.keys(data.timetables).length === 0) {
            alert("No timetable generated.");
        } else {
            alert("Timetable generated successfully!");
            sessionStorage.setItem("timetable_data", JSON.stringify(data.timetables));
            displayTimetables(data.timetables); // Fixed function name
        }
    })
    .catch(error => {
        console.error("Fetch error:", error);
        alert("Failed to fetch timetable.");
    });
}
function displayTimetables(timetables) {
    const container = document.getElementById("timetable-container");
    container.innerHTML = "<center><h1>Class Timetable</h1></center>";

    if (!timetables || Object.keys(timetables).length === 0) {
        container.innerHTML += "<p class='error'>No timetable data available</p>";
        return;
    }

    for (const [classId, timetable] of Object.entries(timetables)) {
        const sectionDiv = document.createElement("div");
        sectionDiv.className = "timetable-section";

        // Determine number of periods from data
        let maxPeriods = 7; // default minimum
        for (const daySchedule of Object.values(timetable.schedule)) {
            if (daySchedule && daySchedule.length > maxPeriods) {
                maxPeriods = daySchedule.length;
            }
        }
        const noOfHoursPerDay = Math.min(Math.max(maxPeriods, 7), 8); // Clamp between 7-8

        // Display class info
        const title = document.createElement("h2");
        title.textContent = `${timetable.year} - Semester ${timetable.semester} (${noOfHoursPerDay} periods/day)`;
        sectionDiv.appendChild(title);

        // Staff and Subjects
        const metaDiv = document.createElement("div");
        metaDiv.className = "timetable-meta";
        metaDiv.innerHTML = `
            <center><p><strong>Staff:</strong> ${timetable.staff.join(', ')}</p></center>
            <center><p><strong>Subjects:</strong> ${timetable.subjects.join(', ')}</p></center>
        `;
        sectionDiv.appendChild(metaDiv);

        // Create table
        const table = document.createElement("table");
        table.className = "timetable-table";

        // Table header
        const headerRow = document.createElement("tr");
        headerRow.innerHTML = "<th>Day/Period</th>";
        for (let i = 1; i <= noOfHoursPerDay; i++) {
            headerRow.innerHTML += `<th>Period ${i}</th>`;
        }
        table.appendChild(headerRow);

        // Process each day
        const days = ["MON", "TUE", "WED", "THU", "FRI"];
        days.forEach(day => {
            const row = document.createElement("tr");
            row.innerHTML = `<td class="day-cell">${day}</td>`;

            // Get schedule for the day (pad with FREE if needed)
            const daySchedule = timetable.schedule[day] || [];
            const paddedSchedule = [...daySchedule];
            while (paddedSchedule.length < noOfHoursPerDay) {
                paddedSchedule.push(null); // Add FREE periods
            }

            for (let period = 0; period < noOfHoursPerDay; period++) {
                const cell = document.createElement("td");
                const slot = paddedSchedule[period];

                if (!slot) {
                    cell.textContent = "FREE";
                    cell.className = "free-slot";
                } else if (typeof slot === 'string') {
                    const [subjectPart, staff] = slot.split('\n');
                    const subjectMatch = subjectPart.match(/^(.+?)\s*\((.*?)\)$/);

                    if (subjectMatch) {
                        const [_, subject, type] = subjectMatch;
                        cell.innerHTML = `${subject} <small>(${type})</small>${staff ? '<br><small>' + staff + '</small>' : ''}`;
                        cell.className = getSlotClass(type);
                    } else {
                        cell.textContent = subjectPart;
                        cell.className = "theory-slot";
                    }
                } else if (typeof slot === 'object') {
                    const subject = slot.subject || "FREE";
                    const type = slot.type || "Theory";
                    const staff = slot.staff || "";

                    cell.innerHTML = subject === "FREE" ? "FREE"
                        : `${subject} <small>(${type})</small>${staff ? '<br><small>' + staff + '</small>' : ''}`;
                    cell.className = subject === "FREE" ? "free-slot" : getSlotClass(type);
                }

                row.appendChild(cell);
            }
            table.appendChild(row);
        });

        sectionDiv.appendChild(table);
        container.appendChild(sectionDiv);
    }
}

function getSlotClass(type) {
    if (!type) return "theory-slot";
    type = type.toLowerCase();
    if (type.includes("lab")) return "lab-slot";
    if (type.includes("pd") || type.includes("pt")) return "pdpt-slot";
    return "theory-slot";
}
    </script>
</body>
</html>
